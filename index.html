const icons={home:'<path d="M3 10 12 3l9 7v11H3z"/><path d="M9 21v-8h6v8"/>',study:'<path d="M4 5h6a2 2 0 0 1 2 2v14a3 3 0 0 0-3-3H4zM20 5h-6a2 2 0 0 0-2 2v14a3 3 0 0 1 3-3h5z"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18"/>',quiz:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="m8 9 2 2 4-4m-6 8h8"/>',review:'<path d="M3 12a9 9 0 1 1 3 7M3 12V5m0 7h7"/>',pen:'<path d="m4 16 12-12 4 4L8 20H4zM14 6l4 4"/>',help:'<path d="M21 11a9 9 0 0 1-9 9H4l2-4a9 9 0 1 1 15-5z"/><path d="M9 9a3 3 0 0 1 6 0c0 2-3 2-3 4m0 3h.01"/>',chart:'<path d="M4 3v18h17M8 16v-5m5 5V7m5 9V4"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2"/>'};const ic=n=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[n]||icons.study}</svg>`;

async function demoHash(p){return Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(p)))).map(x=>x.toString(16).padStart(2,'0')).join('')}
const read=(k,d)=>{try{return JSON.parse(localStorage.getItem('bussola:'+k))??d}catch{return d}}, write=(k,v)=>localStorage.setItem('bussola:'+k,JSON.stringify(v));
async function api(path,body){let r=await fetch('/api/'+path,{method:body===undefined?'GET':'POST',headers:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});let j=await r.json();if(!r.ok)throw Error(j.error||'Não foi possível concluir.');return j}
function toast(t){$('toast').innerHTML=`<div class="toast">${e(t)}</div>`;setTimeout(()=>{$('toast').innerHTML=''},4200)}
async function save(){try{if(server)await api('data',data);else write('data:'+user.email,data);return true}catch(x){toast('Falha ao salvar: '+x.message);return false}}
const brand=()=>`<div class="brand"><span class="mark"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="16" cy="16" r="12"/><path d="m20 6-2 12-10 8 6-13z" fill="currentColor" stroke="none"/><path d="M16 1v4m0 22v4M1 16h4m22 0h4"/></svg></span><div>${e(settings.brand)}<small>ESTUDE COM DIREÇÃO</small></div></div>`;
const btn=(label,action,cls='secondary')=>`<button class="${cls}" onclick="${action}">${label}</button>`, input=(label,name,type='text',val='',req=true)=>`<label>${label}<input name="${name}" type="${type}" value="${e(val)}" ${req?'required':''}></label>`, ta=(label,name,val='',req=true)=>`<label>${label}<textarea name="${name}" ${req?'required':''}>${e(val)}</textarea></label>`, sel=(label,name,options,value='')=>`<label>${label}<select name="${name}">${options.map(o=>`<option ${o===value?'selected':''}>${e(o)}</option>`).join('')}</select></label>`, form=(fn,html,label='Salvar')=>`<form class="form" onsubmit="submitForm(event,${fn})">${html}<button type="submit" class="blue">${label}</button></form>`;
async function submitForm(ev,fn){ev.preventDefault();let f=Object.fromEntries(new FormData(ev.target));try{await fn(f)}catch(x){toast(x.message)}}
const publicNav=()=>`<header class="top">${brand()}<div class="actions">${btn('Ajuda',"go('help')")}${btn('Entrar',"go('login')")}${btn('Criar conta',"go('register')",'blue')}</div></header>`;
const foot=()=>`<footer>${brand()}<p>Organização, constância e evolução na sua preparação.</p><div class="footerlinks">${btn('Perguntas frequentes',"go('faq')",'quiet')}${btn('Contato',"go('help')",'quiet')}${btn('Termos de uso',"go('terms')",'quiet')}${btn('Privacidade',"go('privacy')",'quiet')}</div><small>© ${new Date().getFullYear()} ${e(settings.brand)}</small></footer>`;
const navs=[['home','Meu dia','home'],['study','Estudar','study'],['plan','Planejamento','calendar'],['quiz','Simulados','quiz'],['errors','Caderno de erros','review'],['reviews','Revisões','review'],['essays','Redações','pen'],['history','Desempenho','chart'],['help','Ajuda e SAC','help'],['tickets','Meus chamados','help'],['profile','Meu perfil','gear']];
function nav(){let items=user.role==='student'?navs:user.role==='admin'?[['admin','Administração','gear'],['support','Central de atendimento','help'],['help','Ajuda','help']]:[['support','Central de atendimento','help'],['help','Ajuda','help']];return items.map(([id,title,icon])=>`<button class="${view===id?'active':''}" onclick="go('${id}')">${ic(icon)}${title}</button>`).join('')}
function shell(content,title,sub=''){return `<div class="layout"><header class="app-header"><div class="app-header-inner"><div class="app-brand-row">${brand()}<div class="actions"><span class="badge">${e(user.name)}</span>${btn('Sair','logout()','secondary')}</div></div><nav class="nav app-nav" aria-label="Menu principal">${nav()}</nav></div></header><main class="main"><div class="head"><div><div class="eyebrow">${e(settings.brand)}</div><h2>${title}</h2><p>${e(sub)}</p></div></div>${!server?'<div class="notice">Demonstração online · dados somente neste navegador. Use dados fictícios; não informe senhas reais.</div>':''}${content}</main><div class="bottom">${user.role==='student'?btn(ic('home')+'Meu dia',"go('home')")+btn(ic('study')+'Estudar',"go('study')"):btn(ic('gear')+'Painel',`go('${user.role==='admin'?'admin':'support'}')`)}${btn(ic('help')+'Ajuda',"go('help')")}${btn(ic('gear')+'Menu',"go('menu')")}</div></div>`}

function authPage(){let reg=view==='register',rec=view==='recover',reset=view==='reset';return `<div class="public">${publicNav()}<div class="center"><div class="card"><h2>${reg?'Crie sua conta':rec?'Recuperar acesso':reset?'Definir nova senha':'Bem-vindo de volta'}</h2>${!server?'<div class="notice">Demonstração online sem servidor. Use apenas dados fictícios e senhas de teste.</div>':''}${form(reg?'register':rec?'recover':reset?'resetPassword':'login',(reg?input('Nome','name'):'')+(!reset?input('E-mail','email','email'):'')+(!rec?input('Senha (mínimo 8 caracteres)','password','password'):'')+(reset?input('Código de recuperação','token','text',new URLSearchParams(location.search).get('reset')||''):'')+(reg?'<label><input style="width:auto" type="checkbox" required> Li os termos e a política de privacidade.</label>':''),reg?'Criar conta':rec?'Solicitar recuperação':reset?'Redefinir senha':'Entrar')}<div class="actions" style="margin-top:12px">${btn('Esqueci a senha',"go('recover')",'quiet')}${btn('Criar conta',"go('register')",'quiet')}${btn('Falar com a equipe',"go('help')",'quiet')}</div>${!server?`<hr style="border:0;border-top:1px solid var(--line)"><p>Perfis de teste sem autenticação real:</p><div class="actions">${btn('Aluno de demonstração','demoStudent()')}${btn('Administrador','demoRole(\'admin\')')}${btn('Atendente','demoRole(\'agent\')')}</div>`:''}</div></div>${foot()}</div>`}
async function login(f){if(server){let r=await api('login',f);await enter(r.user,r.data)}else{let users=read('users',{}),u=users[f.email.toLowerCase()];if(!u||u.password!==await demoHash(f.password))throw Error('E-mail ou senha incorretos.');await enter({email:f.email.toLowerCase(),name:u.name,role:'student'},read('data:'+f.email.toLowerCase(),blank()))}}
async function register(f){if(f.password.length<8)throw Error('Use pelo menos 8 caracteres.');if(server){let r=await api('register',f);await enter(r.user,r.data)}else{let users=read('users',{}),key=f.email.toLowerCase();if(users[key])throw Error('E-mail já cadastrado.');users[key]={name:f.name,password:await demoHash(f.password)};write('users',users);await enter({email:key,name:f.name,role:'student'},blank())}}
async function enter(u,d){user=u;data={...blank(),...d};if(!server)write('current',u);go(u.role==='admin'?'admin':u.role==='agent'?'support':!data.profile.exam?'profile':'home')}
async function logout(){if(server)await api('logout',{});else write('current',null);user=null;data=blank();timer={id:null,sec:0,started:0,run:false};go('landing')}
async function recover(f){if(server){await api('recover',f);toast('Se a conta existir e o e-mail estiver configurado, enviaremos instruções.')}else toast('Recuperação real exige o servidor e SMTP. Use um perfil de demonstração.');go('login')}
async function resetPassword(f){if(!server)throw Error('Disponível na versão com servidor.');await api('reset',f);toast('Senha redefinida.');go('login')}
function demoStudent(){if(server){go('register');return}demoRole('student')}
function demoRole(role){let u={name:role==='student'?'Aluno demo':role==='admin'?'Admin demo':'Atendente demo',email:'demo-'+role+'@local.test',role};let d=read('data:'+u.email,blank());if(role==='student'&&!d.profile.exam){d.profile={exam:'Concurso demonstrativo',board:'Autoral',date:'',hours:18};d.topics=[{id:'d1',disc:'Língua Portuguesa',topic:'Ortografia',law:'',done:false},{id:'d2',disc:'Informática',topic:'Segurança',law:'',done:false}];d.sessions=[{id:'s1',topic:'d1',date:today(),time:'09:00',minutes:60,notes:'Revisar os porquês',url:'',material:'',done:false}]}enter(u,d)}
const topicName=id=>{let t=data.topics.find(t=>t.id===id);return t?`${t.disc} · ${t.topic}`:'Sessão de estudo'}, mins=n=>`${Math.floor(n/60)}h ${Math.round(n%60)}m`, due=()=>data.reviews.filter(r=>!r.done&&r.date<=today()).length+data.errors.filter(r=>!r.done&&r.date<=today()).length;
function stats(){let n=data.topics.length,done=data.topics.filter(t=>t.done).length,ans=data.attempts.flatMap(a=>a.answers),correct=ans.filter(a=>a.ok).length;return {hours:data.logs.reduce((s,l)=>s+l.minutes,0),pct:n?Math.round(done/n*100):0,accuracy:ans.length?Math.round(correct/ans.length*100):0,ans:ans.length,correct}}
function graph(){let days=Array.from({length:range},(_,i)=>addDay(i-range+1)),vals=days.map(d=>data.logs.filter(l=>l.date===d).reduce((s,l)=>s+l.minutes,0)),max=Math.max(1,...vals);return `<div class="chart">${days.map((d,i)=>`<div title="${fmt(d)}: ${vals[i]} min"><i style="height:${Math.max(2,vals[i]/max*85)}%"></i>${range===7||i%5===0?d.slice(8):''}</div>`).join('')}</div>`}
function home(){let s=stats(),next=data.sessions.filter(x=>!x.done).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))[0];return shell(`<div class="banner"><div><div class="eyebrow" style="color:#a9cdff">SEU PRÓXIMO PASSO</div><h2>${next?e(topicName(next.topic)):'Pronto para começar?'}</h2><p>${next?fmt(next.date)+' · '+next.minutes+' min':'Crie uma sessão e transforme seu objetivo em rotina.'}</p></div>${btn('Iniciar estudo',next?`startStudy('${next.id}')`:"go('plan')",'blue')}</div><div class="grid">${[['Horas líquidas',mins(s.hours),'history'],['Edital concluído',s.pct+'%','study'],['Acertos',s.ans?s.accuracy+'%':'—','history'],['Revisões pendentes',due(),'reviews']].map(([t,v,p])=>`<button class="card metric" onclick="go('${p}')"><small>${t}</small><strong>${v}</strong><small>Ver registros</small></button>`).join('')}</div><div class="two" style="margin-top:16px"><div class="card"><div class="line"><h3>Evolução de estudo</h3><div class="actions">${btn('7 dias','setRange(7)')}${btn('30 dias','setRange(30)')}</div></div>${graph()}<p>Minutos líquidos por dia · últimos ${range} dias</p></div><div class="card"><h3>Seu radar</h3><div class="line"><span>Concurso</span><b>${e(data.profile.exam||'Não informado')}</b></div><div class="line"><span>Prova</span><b>${fmt(data.profile.date)}</b></div><div class="line"><span>Meta semanal</span><b>${e(data.profile.hours)}h</b></div><div class="bar"><i style="width:${Math.min(100,data.logs.filter(l=>l.date>=addDay(-6)).reduce((s,l)=>s+l.minutes,0)/(Math.max(1,data.profile.hours)*60)*100)}%"></i></div>${btn('Editar perfil',"go('profile')")}</div></div>`, 'Meu dia','Uma etapa de cada vez, sempre em frente.')}
function setRange(n){range=n;render()}
function profile(){let p=data.profile;return shell(`<div class="card">${form('saveProfile',input('Concurso','exam','text',p.exam)+input('Banca','board','text',p.board,false)+input('Data da prova','date','date',p.date,false)+input('Horas disponíveis por semana','hours','number',p.hours),'Salvar e continuar')}</div>`,'Meu perfil','Personalize sua preparação.')}
async function saveProfile(f){if(+f.hours<=0||+f.hours>168)throw Error('Informe horas entre 1 e 168.');data.profile={...f,hours:+f.hours};await save();go('home')}
function study(){return shell(`<div class="two"><div class="card"><h3>Adicionar assunto ao edital</h3>${form('addTopic',input('Disciplina','disc')+input('Assunto','topic')+ta('Artigos de lei / referências','law','',false))}</div><div class="card"><h3>Edital verticalizado</h3><div class="bar"><i style="width:${stats().pct}%"></i></div>${data.topics.map(t=>`<div class="line"><div><b>${e(t.disc)}</b><p>${e(t.topic)}</p><small>${e(t.law)}</small></div><div class="actions">${btn(t.done?'Reabrir':'Concluir',`toggleTopic('${t.id}')`)}${btn('Artigos',`editLaw('${t.id}')`)}</div></div>`).join('')||empty('Cadastre seu primeiro assunto.')}</div></div><div id="lawedit"></div>`, 'Estudar','Seu edital e referências, sem perder o planejamento original.')}
async function addTopic(f){data.topics.push({id:uid(),...f,done:false});await save();render()}
async function toggleTopic(id){let t=data.topics.find(x=>x.id===id);t.done=!t.done;await save();render()}
function editLaw(id){let t=data.topics.find(x=>x.id===id);$('lawedit').innerHTML=`<div class="card" style="margin-top:15px"><h3>Artigos de ${e(t.topic)}</h3>${form('saveLaw',`<input type="hidden" name="id" value="${e(id)}">`+ta('Artigos e referências','law',t.law,false))}</div>`;$('lawedit').scrollIntoView({behavior:'smooth'})}
async function saveLaw(f){data.topics.find(x=>x.id===f.id).law=f.law;await save();toast('Artigos atualizados. Sessões e horários preservados.');render()}
function plan(){let dates=Array.from({length:tab==='month'?30:7},(_,i)=>addDay(i+periodOffset)),sessions=[...data.sessions].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));return shell(`<div class="tabs">${[['week','Semana'],['month','Calendário'],['cycle','Ciclo']].map(([v,t])=>btn(t,`setTab('${v}')`,tab===v?'blue':'secondary')).join('')}</div><div class="card"><div class="line"><h3>${tab==='cycle'?'Fila de sessões':fmt(dates[0])+' a '+fmt(dates.at(-1))}</h3>${tab!=='cycle'?`<div class="actions">${btn('Anterior','shiftPeriod(-1)')}${btn('Próximo','shiftPeriod(1)')}</div>`:''}</div>${tab==='cycle'?sessions.filter(s=>!s.done).map(s=>`<div class="line"><div><b>${e(topicName(s.topic))}</b><p>${s.minutes} min</p></div>${btn('Iniciar',`startStudy('${s.id}')`,'blue')}</div>`).join('')||empty('Nenhuma sessão pendente.'): `<div class="week">${dates.map(d=>`<div class="day"><b>${new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'short',day:'numeric'})}</b>${sessions.filter(s=>s.date===d).map(s=>`<span>${e(s.time)} · ${e(topicName(s.topic))}${s.done?' ✓':''}</span>`).join('')}</div>`).join('')}</div>`}</div><div class="two" style="margin-top:16px"><div class="card"><h3>Nova sessão</h3>${data.topics.length?form('addSession',`<label>Assunto<select name="topic">${data.topics.map(t=>`<option value="${e(t.id)}">${e(topicName(t.id))}</option>`).join('')}</select></label><div class="row2">${input('Data','date','date',today())+input('Horário','time','time','09:00')}</div>`+input('Duração prevista (min)','minutes','number',60)+input('Material','material','text','',false)+input('Link TEC ou outra fonte','url','url','',false)+ta('Anotações','notes','',false)):btn('Cadastrar assunto primeiro',"go('study')")}</div><div class="card"><h3>Todas as sessões</h3>${sessions.map(s=>`<div class="line"><div><b>${e(topicName(s.topic))}</b><p>${fmt(s.date)} · ${e(s.time)} · ${s.minutes} min ${s.done?'· concluída':''}</p><small>${e(s.material)}</small></div>${btn(s.done?'Ver':'Iniciar',`startStudy('${s.id}')`)}</div>`).join('')||empty('Nenhuma sessão cadastrada.')}</div></div>`, 'Planejamento','Semana, calendário e ciclo de estudos.')}
function setTab(t){tab=t;periodOffset=0;render()}function shiftPeriod(n){periodOffset+=n*(tab==='month'?30:7);render()}
async function addSession(f){if(+f.minutes<1||+f.minutes>1440)throw Error('Duração inválida.');data.sessions.push({id:uid(),...f,minutes:+f.minutes,done:false});await save();render()}
function startStudy(id){if(timer.id!==id)timer={id,sec:0,started:0,run:false};go('timer')}
function elapsed(){return timer.sec+(timer.run?Math.floor((Date.now()-timer.started)/1000):0)}function clockText(){let s=elapsed();return [Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(x=>String(x).padStart(2,'0')).join(':')}
function toggleTimer(){if(timer.run){timer.sec=elapsed();timer.run=false}else{timer.started=Date.now();timer.run=true}render()}setInterval(()=>{if($('clock'))$('clock').textContent=clockText()},500);
function timerPage(){let s=data.sessions.find(x=>x.id===timer.id);if(!s)return plan();let t=data.topics.find(t=>t.id===s.topic);return shell(`<div class="card"><h3>${e(topicName(s.topic))}</h3><p>${e(s.material)} · Meta: ${s.minutes} min</p><div class="clock" id="clock">${clockText()}</div><div class="actions">${btn(timer.run?'Pausar':elapsed()?'Retomar':'Começar cronômetro','toggleTimer()','blue')}${btn('Voltar',"go('plan')")}</div><p style="margin-top:12px">Lei seca: ${e(t?.law||'Não cadastrada')}</p>${/^https?:\/\//i.test(s.url)?`<a href="${e(s.url)}" target="_blank" rel="noopener">Abrir material externo</a>`:''}</div><div class="card" style="margin-top:15px">${form('finishSession',input('Minutos manuais (opcional; vazio usa cronômetro)','manual','number','',false)+ta('Anotações da sessão','notes',s.notes,false),'Concluir sessão')}</div>`, 'Sessão de estudo')}
async function finishSession(f){let s=data.sessions.find(x=>x.id===timer.id),m=f.manual!==''?+f.manual:Math.round(elapsed()/60);if(!Number.isFinite(m)||m<0||m>1440)throw Error('Tempo inválido.');if(s.done)throw Error('Sessão já concluída.');s.notes=f.notes;s.done=true;data.logs.push({id:uid(),session:s.id,topic:s.topic,minutes:m,date:today(),notes:f.notes});timer={id:null,sec:0,started:0,run:false};await save();go('home')}
function quizPage(){if(!quiz)return shell(`<div class="card"><h3>Configurar simulado</h3><p>Banco inicial de questões autorais demonstrativas. Adicione questões no painel administrativo.</p>${form('beginQuiz',sel('Banca','board',['Todas',...new Set(bank.map(q=>q.board))])+sel('Disciplina','disc',['Todas',...new Set(bank.map(q=>q.disc))])+sel('Dificuldade','level',['Todas','Fácil','Média','Difícil'])+input('Quantidade','count','number',5),'Iniciar simulado')}</div>`, 'Simulados');let q=quiz.questions[quiz.i];if(!q)return resultPage();return shell(`<div class="card"><div class="line"><span class="pill">Questão ${quiz.i+1}/${quiz.questions.length}</span><span>${e(q.disc)} · ${e(q.level)}</span></div><div class="bar"><i style="width:${quiz.i/quiz.questions.length*100}%"></i></div><h3 style="margin:20px 0">${e(q.q)}</h3>${q.opts.map((o,i)=>`<button class="choice ${quiz.confirmed?(i===q.a?'correct':i===quiz.pick?'wrong':''):quiz.pick===i?'selected':''}" ${quiz.confirmed?'disabled':''} onclick="choose(${i})">${q.opts.length>2?String.fromCharCode(65+i)+') ':''}${e(o)}</button>`).join('')}${quiz.confirmed?`<div class="${quiz.pick===q.a?'ok':'notice'}"><b>${quiz.pick===q.a?'Você acertou!':'Resposta incorreta.'}</b><br>Gabarito: ${e(q.opts[q.a])}<br>${e(q.why)}</div>${btn(quiz.i===quiz.questions.length-1?'Finalizar simulado':'Próxima questão','nextQuestion()','blue')}`:`<button class="blue" ${quiz.pick===null?'disabled':''} onclick="confirmAnswer()">Confirmar resposta</button>`}</div>`, 'Simulados','Treine, corrija e revise.')}
function beginQuiz(f){let qs=bank.filter(q=>(f.board==='Todas'||q.board===f.board)&&(f.disc==='Todas'||q.disc===f.disc)&&(f.level==='Todas'||q.level===f.level));if(!qs.length)throw Error('Não há questões nesses filtros.');if(+f.count<1)throw Error('Quantidade inválida.');if(qs.length<+f.count)toast(`Há ${qs.length} questões disponíveis.`);for(let i=qs.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[qs[i],qs[j]]=[qs[j],qs[i]]}quiz={questions:qs.slice(0,+f.count),i:0,pick:null,confirmed:false,answers:[],stored:false};render()}
function choose(i){if(!quiz.confirmed){quiz.pick=i;render()}}async function confirmAnswer(){if(quiz.confirmed||quiz.pick===null)return;let q=quiz.questions[quiz.i],a={q:q.q,topic:q.topic,disc:q.disc,marked:q.opts[quiz.pick],correct:q.opts[q.a],why:q.why,ok:quiz.pick===q.a};quiz.answers.push(a);quiz.confirmed=true;if(!a.ok){data.errors.push({id:uid(),...a,date:addDay(1),done:false,created:today()});await save()}render()}
async function nextQuestion(){if(!quiz.confirmed)return;quiz.i++;quiz.pick=null;quiz.confirmed=false;if(quiz.i>=quiz.questions.length&&!quiz.stored){data.attempts.push({id:uid(),date:today(),answers:quiz.answers});quiz.stored=true;await save()}render()}
function resultPage(){let a=quiz.answers,wrong=a.filter(x=>!x.ok),groups={};a.forEach(x=>{let k=x.disc+' · '+x.topic;groups[k]??=[0,0];groups[k][1]++;if(x.ok)groups[k][0]++});return shell(`<div class="banner"><div><h2>${a.length-wrong.length}/${a.length} acertos</h2><p>${Math.round((a.length-wrong.length)/a.length*100)}% de aproveitamento</p></div>${btn('Novo simulado','quiz=null;render()','blue')}</div><div class="card"><h3>Diagnóstico por assunto</h3>${Object.entries(groups).map(([k,v])=>`<div class="line"><span>${e(k)}</span><b>${v[0]}/${v[1]}</b></div>`).join('')}</div><div class="card" style="margin-top:12px"><h3>Caderno consolidado</h3>${wrong.map(errorHTML).join('')||empty('Nenhum erro.')}</div><div class="card" style="margin-top:12px"><h3>Resumo curto das erradas</h3>${wrong.map(x=>`<p><b>${e(x.topic)}:</b> ${e(x.why)}</p>`).join('')||empty('Nenhum erro.')}${btn('Revisar erros',"go('errors')",'blue')}</div>`, 'Resultado do simulado')}
function errorHTML(x){return `<div class="line"><div><b>${e(x.disc)} · ${e(x.topic)}</b><p>${e(x.q)}</p><small>Marcada: ${e(x.marked)} | Gabarito: ${e(x.correct)}</small><p>${e(x.why)}</p>${x.date?`<small>Próxima revisão: ${fmt(x.date)} ${x.done?'· concluída':''}</small>`:''}</div>${x.id?`<div class="actions">${btn(x.done?'Reabrir':'Revisado',`markReview('errors','${x.id}')`)}${btn('Reagendar',`reschedule('errors','${x.id}')`)}</div>`:''}</div>`}
function errorsPage(){return shell(`<div class="card"><h3>${data.errors.length} registros</h3>${data.errors.map(errorHTML).join('')||empty('Os erros dos simulados aparecerão aqui.')}</div><div id="reschedule"></div>`, 'Caderno de erros','Transforme cada erro em aprendizado.')}
function reviews(){let items=[...data.reviews.map(x=>({...x,type:'reviews'})),...data.errors.map(x=>({...x,type:'errors',title:x.topic,front:x.q,back:x.why}))].sort((a,b)=>a.date.localeCompare(b.date));return shell(`<div class="two"><div class="card"><h3>Fila de revisão · ${due()} pendentes hoje</h3>${items.map(x=>`<div class="line"><div><span class="pill">${x.done?'Concluída':x.date<=today()?'Pendente':'Agendada'}</span><h3>${e(x.title)}</h3><details><summary>${e(x.front)}</summary><p>${e(x.back)}</p></details><small>${fmt(x.date)}</small></div><div class="actions">${btn(x.done?'Reabrir':'Concluir',`markReview('${x.type}','${x.id}')`)}${btn('Reagendar',`reschedule('${x.type}','${x.id}')`)}</div></div>`).join('')||empty('Sem revisões.')}</div><div class="card"><h3>Adicionar revisão</h3>${form('addReview',sel('Tipo','kind',['Flashcard','Lei seca','Anotação'])+input('Título','title')+ta('Frente / conteúdo','front')+ta('Resposta / observação','back','',false)+input('Data','date','date',today()))}</div></div><div id="reschedule"></div>`, 'Revisões','Reforce o que realmente precisa ser memorizado.')}
async function addReview(f){data.reviews.push({id:uid(),...f,done:false});await save();render()}async function markReview(k,id){let r=data[k].find(x=>x.id===id);r.done=!r.done;await save();render()}
function reschedule(k,id){$('reschedule').innerHTML=`<div class="card" style="margin-top:12px">${form('saveSchedule',`<input type="hidden" name="kind" value="${k}"><input type="hidden" name="id" value="${id}">`+input('Nova data','date','date',addDay(1)))}</div>`;$('reschedule').scrollIntoView({behavior:'smooth'})}async function saveSchedule(f){let r=data[f.kind].find(x=>x.id===f.id);r.date=f.date;r.done=false;await save();render()}
const criteria=['Gramática','Coesão','Coerência','Estrutura','Argumentação','Atendimento ao tema'];
function essays(){return shell(`<div class="two"><div class="card"><h3>Nova redação</h3>${form('addEssay',input('Tema','theme')+input('Data','date','date',today())+input('Tempo de escrita (min)','minutes','number',60)+ta('Texto','text','',false)+`<label>Arquivo (até 1 MB)<input type="file" id="essayFile" accept=".pdf,.txt,.docx,.png,.jpg"></label>`,'Registrar redação')}</div><div class="card"><h3>Histórico e evolução</h3>${data.essays.map(x=>`<div class="line"><div><b>${e(x.theme)}</b><p>${fmt(x.date)} · ${x.minutes} min</p><p>${x.versions.length?x.versions.map(v=>e(v.score)).join(' → ')+' / 100':'Aguardando avaliação'}</p></div>${btn('Avaliar / ver',`openEssay('${x.id}')`)}</div>`).join('')||empty('Nenhuma redação cadastrada.')}</div></div><div id="essayEdit"></div>`, 'Redações','Acompanhe sua evolução entre versões.')}
async function addEssay(f){let file=$('essayFile').files[0],attachment=null;if(file){if(file.size>1048576)throw Error('Arquivo acima de 1 MB.');attachment={name:file.name,bytes:await new Promise((r,j)=>{let fr=new FileReader();fr.onload=()=>r(fr.result.split(',')[1]);fr.onerror=j;fr.readAsDataURL(file)})}}if(!f.text&&!attachment)throw Error('Informe texto ou arquivo.');data.essays.push({id:uid(),...f,attachment,versions:[]});await save();render()}
function openEssay(id){let x=data.essays.find(x=>x.id===id);$('essayEdit').innerHTML=`<div class="card" style="margin-top:15px"><h3>${e(x.theme)}</h3><p style="white-space:pre-wrap">${e(x.text)}</p>${x.attachment?btn('Abrir arquivo',`downloadEssay('${id}')`):''}${x.versions.map((v,i)=>`<details><summary>Versão ${i+1} · ${e(v.score)}/100 · ${fmt(v.date)}</summary><p>${e(v.comments)}</p>${criteria.map((c,j)=>`<p>${c}: ${e(v['c'+j])}</p>`).join('')}<p>${e(v.text)}</p></details>`).join('')}<h3 style="margin-top:16px">Registrar avaliação / nova versão</h3>${form('saveEssayVersion',`<input type="hidden" name="id" value="${id}">`+input('Nota final (0–100)','score','number')+criteria.map((c,i)=>input(c+' (nota ou comentário)','c'+i)).join('')+ta('Comentários','comments')+ta('Texto da versão','text',x.versions.at(-1)?.text||x.text,false))}</div>`;$('essayEdit').scrollIntoView({behavior:'smooth'})}
function downloadEssay(id){let a=data.essays.find(x=>x.id===id).attachment,b=Uint8Array.from(atob(a.bytes),c=>c.charCodeAt(0)),url=URL.createObjectURL(new Blob([b],{type:'application/octet-stream'})),link=document.createElement('a');link.href=url;link.download=a.name;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function saveEssayVersion(f){if(+f.score<0||+f.score>100)throw Error('Nota entre 0 e 100.');let x=data.essays.find(x=>x.id===f.id);x.versions.push({...f,date:today()});await save();render();openEssay(x.id)}
function history(){let s=stats();return shell(`<div class="grid"><div class="card metric"><small>Horas líquidas</small><strong>${mins(s.hours)}</strong></div><div class="card metric"><small>Questões respondidas</small><strong>${s.ans}</strong></div><div class="card metric"><small>Acertos</small><strong>${s.correct}</strong></div></div><div class="card" style="margin-top:14px"><div class="line"><h3>Atividade por dia</h3><div class="actions">${btn('7 dias','setRange(7)')}${btn('30 dias','setRange(30)')}</div></div>${graph()}</div><div class="two" style="margin-top:14px"><div class="card"><h3>Sessões realizadas</h3>${data.logs.map(l=>`<div class="line"><span>${fmt(l.date)} · ${e(topicName(l.topic))}</span><b>${l.minutes} min</b></div>`).join('')||empty('Sem registros.')}</div><div class="card"><h3>Simulados realizados</h3>${data.attempts.map(a=>`<details><summary>${fmt(a.date)} · ${a.answers.filter(x=>x.ok).length}/${a.answers.length} acertos</summary>${a.answers.map(errorHTML).join('')}</details>`).join('')||empty('Sem registros.')}</div></div>`, 'Desempenho','Indicadores baseados nos seus registros.')}
const states=['Aberto','Em atendimento','Aguardando resposta','Resolvido'];let ticketList=[];function help(){let w=settings.whatsapp.replace(/\D/g,''),g=settings.gmail;let content=`<div class="grid"><div class="card"><h3>WhatsApp</h3><p>Converse diretamente com a equipe.</p>${w?`<a href="https://wa.me/${e(w)}?text=${encodeURIComponent('Olá! Preciso de ajuda com a plataforma.')}" target="_blank" rel="noopener"><button>Conversar no WhatsApp</button></a>`:'<button disabled>Contato não configurado</button>'}</div><div class="card"><h3>Gmail</h3><p>${e(g||'Endereço ainda não configurado')}</p>${g?`<a target="_blank" rel="noopener" href="https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(g)}&su=${encodeURIComponent('Atendimento – '+settings.brand)}"><button>Escrever no Gmail</button></a> ${btn('Copiar endereço','copyEmail()')}`:'<button disabled>Contato não configurado</button>'}</div><div class="card"><h3>Horário de atendimento</h3><p>${e(settings.hours)}</p>${btn('Acompanhar protocolo',"go('track')")}</div></div><div class="card" style="margin-top:16px"><h3>Abrir chamado pelo site</h3>${form('createTicket',input('Nome','name','text',user?.name||'')+input('E-mail','email','email',user?.email||'')+sel('Categoria','category',['Acesso à conta','Planejamento','Simulados','Pagamento','Sugestão','Outros'])+input('Assunto','subject')+ta('Mensagem','message'),'Enviar chamado')}<div id="protocol"></div></div>`;return user?shell(content,'Fale com a equipe'):`<div class="public">${publicNav()}<section class="section"><h2>Fale com a equipe</h2><p>Estamos aqui para ajudar, inclusive sem conta.</p>${content}</section>${foot()}</div>`}
async function copyEmail(){try{await navigator.clipboard.writeText(settings.gmail);toast('Endereço copiado.')}catch{prompt('Copie o endereço:',settings.gmail)}}
async function createTicket(f){let r;if(server)r=await api('ticket',f);else{r={...f,id:'BA-'+uid().slice(0,8).toUpperCase(),token:uid(),status:'Aberto',owner:user?.email||'',date:today(),messages:[],assigned:''};let all=read('tickets',[]);all.push(r);write('tickets',all)}privateToken=r.token;let url=server?location.origin+'/?ticket='+encodeURIComponent(r.token):'';$('protocol').innerHTML=`<div class="ok" style="margin-top:12px"><b>Chamado registrado: ${e(r.id)}</b><p>Guarde seu código privado: ${e(r.token)}</p>${url?`<a href="${e(url)}">Link privado de acompanhamento</a>`:''}<p>${server?(r.sent?'Notificação enviada por e-mail.':'E-mail não enviado; o chamado foi preservado.'):'Demonstração: nenhum e-mail foi enviado.'}</p>${btn('Acompanhar chamado',"go('track')")}</div>`}
async function loadTickets(){ticketList=server?await api('tickets'):read('tickets',[]).filter(t=>user.role!=='student'||t.owner===user.email);render()}
function ticketRows(){return ticketList.map(t=>`<div class="line"><div><span class="pill">${e(t.status)}</span><h3>${e(t.id)} · ${e(t.subject)}</h3><p>${e(t.name)} · ${e(t.category)} · ${fmt(t.date)}</p></div>${btn('Abrir',`openTicket('${t.id}')`)}</div>`).join('')||empty('Nenhum chamado encontrado.')}
function ticketsPage(){return shell(`<div class="card"><div class="line"><h3>Chamados</h3>${btn('Atualizar','loadTickets()')}</div><input placeholder="Buscar protocolo ou assunto" oninput="filterTickets(this.value)"><div id="ticketRows">${ticketRows()}</div></div><div id="ticketDetail"></div>`,user.role==='student'?'Meus chamados':'Central de atendimento')}
function filterTickets(q){let old=ticketList;ticketList=old.filter(t=>(t.id+' '+t.subject).toLowerCase().includes(q.toLowerCase()));$('ticketRows').innerHTML=ticketRows();ticketList=old}
function thread(t){return `<div class="card" style="margin-top:12px"><span class="pill">${e(t.status)}</span><h3>${e(t.id)} · ${e(t.subject)}</h3><p style="white-space:pre-wrap">${e(t.message)}</p>${t.messages.map(m=>`<div class="line"><div><b>${e(m.author)}</b><p style="white-space:pre-wrap">${e(m.text)}</p><small>${fmt(m.date)}</small></div></div>`).join('')}</div>`}
function openTicket(id){let t=ticketList.find(x=>x.id===id),staff=user.role!=='student';$('ticketDetail').innerHTML=thread(t)+`<div class="card">${form('updateTicket',`<input type="hidden" name="id" value="${e(id)}">`+(staff?sel('Status','status',states,t.status)+input('Responsável','assigned','text',t.assigned,false):'')+ta('Mensagem','reply','',false),'Salvar resposta')}${staff&&server?btn('Reenviar notificação',`retryMail('${id}')`):''}</div>`;$('ticketDetail').scrollIntoView({behavior:'smooth'})}
async function retryMail(id){let r=await api('retry',{id});toast(r.sent?'Aviso enviado.':'Aviso não enviado. Verifique SMTP.')}
async function updateTicket(f){if(server)await api('ticket/update',f);else{let all=read('tickets',[]),t=all.find(x=>x.id===f.id);if(user.role!=='student'){t.status=f.status;t.assigned=f.assigned}if(f.reply)t.messages.push({author:user.name,text:f.reply,date:today()});write('tickets',all)}await loadTickets();openTicket(f.id);toast('Chamado atualizado.')}
function track(){let html=`<div class="card">${form('findTicket',input('Código privado de acompanhamento','token','text',privateToken),'Consultar chamado')}<div id="tracked"></div></div>`;return user?shell(html,'Acompanhar chamado'):`<div class="public">${publicNav()}<div class="center"><h2>Acompanhar chamado</h2>${html}</div>${foot()}</div>`}
async function findTicket(f){let t=server?await api('track',f):read('tickets',[]).find(x=>x.token===f.token);if(!t)throw Error('Chamado não encontrado.');privateToken=f.token;$('tracked').innerHTML=thread(t)+form('visitorReply',ta('Sua resposta','reply'),'Enviar resposta')}
async function visitorReply(f){if(server)await api('track/reply',{token:privateToken,reply:f.reply});else{let all=read('tickets',[]),t=all.find(x=>x.token===privateToken);t.messages.push({author:'Visitante',text:f.reply,date:today()});write('tickets',all)}await findTicket({token:privateToken})}
function admin(){return shell(`<div class="two"><div class="card"><h3>Marca e atendimento</h3>${form('saveSettings',input('Nome da plataforma','brand','text',settings.brand)+input('Gmail de atendimento','gmail','email',settings.gmail,false)+input('WhatsApp com DDI e DDD','whatsapp','text',settings.whatsapp,false)+input('Horário de atendimento','hours','text',settings.hours)+ta('FAQ (pergunta | resposta, uma por linha)','faq',settings.faq.map(x=>x.join(' | ')).join('\n'),false))}</div><div class="card"><h3>Banco de questões · ${bank.length}</h3>${form('addQuestion',input('Banca / origem','board','text','Autoral')+input('Disciplina','disc')+input('Assunto','topic')+sel('Dificuldade','level',['Fácil','Média','Difícil'],'Média')+ta('Enunciado','q')+ta('Alternativas (uma por linha; 2 ou 4)','opts')+input('Número da alternativa correta (1 a 4)','a','number',1)+ta('Justificativa','why'),'Cadastrar questão')}</div></div><div class="card" style="margin-top:15px"><h3>Questões cadastradas</h3>${bank.map(q=>`<div class="line"><div><b>${e(q.disc)} · ${e(q.topic)}</b><p>${e(q.q)}</p></div>${btn('Editar',`editQuestion('${q.id}')`)}</div>`).join('')}</div><div id="questionEdit"></div>`, 'Administração','Gerencie a identidade, atendimento e conteúdos.')}
async function saveSettings(f){if(f.whatsapp&&!/^\+?\d[\d ()-]{8,18}$/.test(f.whatsapp))throw Error('Informe o número com DDI e DDD.');settings={...f,faq:f.faq.split('\n').filter(x=>x.includes('|')).map(x=>{let [q,...a]=x.split('|');return [q.trim(),a.join('|').trim()]})};if(server)await api('settings',settings);else write('settings',settings);render();toast('Configurações salvas.')}
async function addQuestion(f){let opts=f.opts.split('\n').map(x=>x.trim()).filter(Boolean),a=+f.a-1;if(![2,4].includes(opts.length)||!Number.isInteger(a)||a<0||a>=opts.length)throw Error('Confira as alternativas e o gabarito.');let q={...f,opts,a,id:f.id||uid()};let i=bank.findIndex(x=>x.id===q.id);if(i<0)bank.push(q);else bank[i]=q;if(server)await api('bank',bank);else write('bank',bank);render();toast('Questão salva.')}
function editQuestion(id){let q=bank.find(x=>x.id===id);$('questionEdit').innerHTML=`<div class="card">${form('addQuestion',`<input type="hidden" name="id" value="${e(id)}">`+input('Banca','board','text',q.board)+input('Disciplina','disc','text',q.disc)+input('Assunto','topic','text',q.topic)+sel('Dificuldade','level',['Fácil','Média','Difícil'],q.level)+ta('Enunciado','q',q.q)+ta('Alternativas','opts',q.opts.join('\n'))+input('Número da correta','a','number',q.a+1)+ta('Justificativa','why',q.why))}</div>`;$('questionEdit').scrollIntoView({behavior:'smooth'})}
function info(){let content=view==='faq'?faq():view==='terms'?'<p>Modelo de termos: use a plataforma de forma responsável e mantenha a segurança de seu acesso. O conteúdo é educacional e não garante aprovação. Os termos definitivos devem ser revisados pelo responsável antes da publicação.</p>':'<p>Modelo de política: os registros de estudo e atendimento são usados para operar a plataforma. Solicite acesso, correção ou exclusão dos dados pelo SAC. Antes da publicação, defina o controlador, bases legais, retenção e direitos conforme a LGPD.</p>';return `<div class="public">${publicNav()}<section class="section"><h2>${view==='faq'?'Perguntas frequentes':view==='terms'?'Termos de uso':'Política de privacidade'}</h2>${content}${btn('Voltar',`go('${user?'home':'landing'}')`)}</section>${foot()}</div>`}
function render(){let pages={landing,login:authPage,register:authPage,recover:authPage,reset:authPage,help,track,faq:info,terms:info,privacy:info,home,profile,study,plan,timer:timerPage,quiz:quizPage,errors:errorsPage,reviews,essays,history,admin,support:ticketsPage,tickets:ticketsPage,menu:()=>shell(`<div class="card nav">${nav()}${btn('Sair','logout()')}</div>`,'Menu')};if(!user&&!['landing','login','register','recover','reset','help','track','faq','terms','privacy'].includes(view))view='login';if(user&&view==='admin'&&user.role!=='admin')view='home';if(user&&view==='support'&&user.role==='student')view='tickets';$('app').innerHTML=(pages[view]||landing)();const menu=document.querySelector('.app-nav'),active=menu?.querySelector('.active');if(active&&menu.scrollWidth>menu.clientWidth){menu.scrollLeft=Math.max(0,active.offsetLeft-menu.offsetLeft-(menu.clientWidth-active.offsetWidth)/2)}}
const originalGo=go;go=function(v){originalGo(v);if(['support','tickets'].includes(v)&&user)loadTickets().catch(x=>toast(x.message))};
(async()=>{try{if(server){let r=await api('init');settings=r.settings;bank=r.bank; if(r.user){user=r.user;data={...blank(),...r.data};view=user.role==='admin'?'admin':user.role==='agent'?'support':data.profile.exam?'home':'profile'}}else{settings=read('settings',DEFAULT);bank=read('bank',BANK);user=read('current',null);if(user){data=read('data:'+user.email,blank());view=user.role==='admin'?'admin':user.role==='agent'?'support':data.profile.exam?'home':'profile'}}let p=new URLSearchParams(location.search);if(p.has('ticket')){privateToken=p.get('ticket');view='track'}if(p.has('reset'))view='reset';render();if(view==='track'&&privateToken)await findTicket({token:privateToken});if(view==='support')await loadTickets()}catch(x){render();toast('Não foi possível inicializar: '+x.message)}})();
</script></body></html>
